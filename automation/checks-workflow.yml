# Optional workflow; copy into .github/workflows with workflow-authorized credentials.
name: Check application

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore frontend dependencies
        run: npm ci --prefix frontend
      - name: Check frontend behavior
        run: npm test --prefix frontend
      - name: Build embedded assets
        run: npm run build --prefix frontend
      - name: Build the shared website preview
        run: npm run build:site-preview --prefix frontend
      - name: Check website behavior and source freshness
        run: node --test site/tests/demo.test.mjs
      # Contract/UI checks do not replace the Windows native build and device checks.
      - name: Check Go contracts without the native SDK
        run: go test -tags legacy_receiver ./...
      - name: Check Go diagnostics without the native SDK
        run: go vet -tags legacy_receiver ./...
